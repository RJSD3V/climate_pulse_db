name: 'climate_works_dbt'
version: '1.0.0'
config-version: 2

profile: 'climate_works_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # GHCN-D core elements modelled by this project
  core_elements: ['PRCP', 'SNOW', 'SNWD', 'TMAX', 'TMIN']

models:
  climate_works_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  climate_works_dbt:
    ghcn_source_flags:
      +column_types:
        source_flag: varchar
        source_name: varchar
        priority_rank: integer
    ghcn_elements:
      +column_types:
        element: varchar
        scale_factor: double
